name: Release Windows and Ubuntu x64

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  package:
    name: Build standalone executable (${{ matrix.rid }})
    needs: tests
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            rid: win-x64
          - runner: ubuntu-24.04
            rid: linux-x64
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: ga

      - name: Prepare and verify release files
        shell: pwsh
        env:
          RELEASE_RID: ${{ matrix.rid }}
        run: |
          if ($env:GITHUB_REF_NAME -cnotmatch '^v(?<version>.+)$') {
            throw 'Expected a version tag starting with v.'
          }
          $output = Join-Path $env:RUNNER_TEMP 'vsix-release'
          ./.github/scripts/Build-Release.ps1 -Version $Matches.version -RuntimeIdentifier $env:RELEASE_RID -OutputDirectory $output

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: vsix-downloader-${{ matrix.rid }}
          path: ${{ runner.temp }}/vsix-release/assets/
          if-no-files-found: error
          compression-level: 0
          overwrite: true

  publish:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: vsix-downloader-*
          path: ${{ runner.temp }}/vsix-release-assets
          merge-multiple: false

      - name: Verify checksum and publish
        shell: bash
        working-directory: ${{ runner.temp }}/vsix-release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          win=vsix-downloader-win-x64
          linux=vsix-downloader-linux-x64
          win_asset="$win/$win.exe"
          linux_asset="$linux/$linux"
          (cd "$win" && sha256sum --check --strict SHA256SUMS.txt)
          (cd "$linux" && sha256sum --check --strict SHA256SUMS.txt)

          release_flags=(--verify-tag --generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease)
          fi

          gh release create "$GITHUB_REF_NAME" \
            "$win_asset" "$linux_asset" "${release_flags[@]}"
